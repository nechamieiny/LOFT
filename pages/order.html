    <main>
<main>
    <section class="order-section">
        <h1>בואו להזמין את הרהיט שלכם!</h1>
        <p>השאירו פרטים ונחזור אליכם בהקדם לתיאום ההזמנה.</p>
<form action="success.html" method="get">
    <label for="fullName">שם מלא:</label>
    <input type="text" id="fullName" name="fullName" required>
    <label for="phone">מספר טלפון:</label>
    <input type="tel" id="phone" name="phone" required>
    <label for="email">כתובת מייל:</label>
    <input type="email" id="email" name="email" required>
    <label for="deliveryDate">תאריך אספקה מבוקש:</label>
    <input type="date" id="deliveryDate" name="deliveryDate">
    <label for="product">איזה רהיט תרצו להזמין?</label>
    <select id="product" name="product" required>
    <option value="">בחרו רהיט</option>
    <option value="sofa">ספה</option>
    <option value="armchair">כורסא</option>
    <option value="bed">מיטה</option>
    <option value="dining">פינת אוכל</option>
    <option value="other">אחר</option>
    <label for="message">הערות נוספות:</label>
</select>
<textarea id="message" name="message" rows="4"
    placeholder="כתבו כאן פרטים נוספים על ההזמנה..."></textarea>
    <button type="submit" class="order-button">
    שליחת הזמנה
</button>

</form>
    </section>
</main>
    </main>
